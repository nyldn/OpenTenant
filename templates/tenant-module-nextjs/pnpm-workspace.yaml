packages:
  - .
overrides:
  # Match the root patched Vite line for the standalone starter.
  vite: 7.3.7
  # Keep standalone starter tests on the worker prototype-pollution fixes.
  tinypool: 2.2.0
  # GHSA-fxqj-rqcc-2cmp source-map traversal is fixed in 8.5.23.
  postcss: 8.5.23
  # Next 15's optional range trails the libvips fixes in GHSA-f88m-g3jw-g9cj.
  sharp: 0.35.5
  # PostCSS supports nanoid 3.3.18, which fixes GHSA-2v37-7h3g-55p8.
  'postcss>nanoid': 3.3.18
  # Patched source-map handling used by PostCSS.
  source-map-js: 1.2.2
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
