packages:
  - apps/*
  - examples/*
  - modules/*
  - packages/*
  - templates/*
  - tooling/*
overrides:
  # GHSA prototype-pollution worker RCE fixes; verified against Vitest 3 and 4.
  tinypool: 2.2.0
  # OpenFGA SDK 0.9.7 pins vulnerable Axios 1.19.0. Keep the fixed transport.
  '@openfga/sdk>axios': 1.20.0
  # Keep Vercel, Next, Sentry and the Node SDK on one compatible OTel API.
  '@opentelemetry/api': 1.9.1
  # Sentry Cloudflare adapter requires the patched Vite line (GHSA-587h-7wmj-h5pm).
  vite: 7.3.7
  # GHSA-fxqj-rqcc-2cmp source-map traversal is fixed in 8.5.23.
  postcss: 8.5.23
  # Includes subsequent brace-expansion resource-exhaustion fixes through 5.0.12.
  brace-expansion: 5.0.12
  # Next 15's optional range trails the libvips fixes in GHSA-f88m-g3jw-g9cj.
  sharp: 0.35.5
  # Includes subsequent Undici cache, request and resource-exhaustion fixes through 7.30.1.
  undici: 7.30.1
  # PostCSS supports nanoid 3.3.18, which fixes GHSA-2v37-7h3g-55p8.
  'postcss>nanoid': 3.3.18
  # Same-major fixes for transitive production dependencies.
  devalue: 5.9.3
  piscina: 4.9.4
  '@xhmikosr/decompress': 11.1.4
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  'zod@4': 4.6.6
  body-parser: 2.4.0
  qs: 6.16.1
allowBuilds:
  '@swc/core': true
  cbor-extract: true
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: true
  ssh2: false
minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.21'
  - '@better-auth/drizzle-adapter@1.7.21'
  - '@better-auth/kysely-adapter@1.7.21'
  - '@better-auth/memory-adapter@1.7.21'
  - '@better-auth/mongo-adapter@1.7.21'
  - '@better-auth/prisma-adapter@1.7.21'
  - '@better-auth/scim@1.7.21'
  - '@better-auth/sso@1.7.21'
  - '@better-auth/telemetry@1.7.21'
  - better-auth@1.7.21
