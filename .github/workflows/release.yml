name: Release packages

# Enabling publishing or automatic triggers is an owner decision recorded in
# docs/OWNER-TASKS.md (OWNER-NPM-RELEASE-01). Keep dispatch dry by default.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and pack without a version PR or npm publication
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (inputs.dry_run || vars.OWNER_NPM_RELEASE_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - name: Install pinned package secret scanner
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_checksums.txt" -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          (cd "$RUNNER_TEMP" && sha256sum --check --ignore-missing gitleaks-checksums.txt)
          tar -xzf "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: pnpm package:check
      - run: pnpm audit --audit-level high
      - name: Publication dry run
        if: inputs.dry_run
        run: pnpm -r publish --dry-run --provenance --access public --no-git-checks
      - name: Version PR or provenance publication
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            git checkout -B changeset-release/main
            pnpm changeset version
            pnpm install --lockfile-only
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m 'chore(release): version public packages' -m 'Marketing impact: truth.'
            git push --force-with-lease origin changeset-release/main
            if ! gh pr view changeset-release/main >/dev/null 2>&1; then
              printf '%s\n' 'Version public packages together. Publication remains owner gated.' > "$RUNNER_TEMP/release-body.md"
              gh pr create --base main --head changeset-release/main --title 'chore(release): version public packages' --body-file "$RUNNER_TEMP/release-body.md"
            fi
          else
            pnpm -r publish --provenance --access public
          fi
